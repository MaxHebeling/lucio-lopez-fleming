name: Backup nocturno + simulacro de restore

on:
  schedule:
    - cron: "15 6 * * *" # 03:15 hora de Salta
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: postgres }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    env:
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      BACKUP_ENCRYPT_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
    steps:
      - name: Verificar configuración
        id: cfg
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$BACKUP_ENCRYPT_RECIPIENT" ]; then
            echo "::warning::Backup no configurado: faltan secretos PROD_DATABASE_URL y/o BACKUP_AGE_RECIPIENT (ver docs/BACKUP_RESTORE.md)"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.enabled == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.cfg.outputs.enabled == 'true'
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.enabled == 'true'
        with: { node-version: 22, cache: pnpm }
      - name: Herramientas (cliente Postgres 17, age)
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -q && sudo apt-get install -yq postgresql-client-17 age
          pnpm install --frozen-lockfile
      - name: Backup
        if: steps.cfg.outputs.enabled == 'true'
        run: BACKUP_ENCRYPT_RECIPIENT= bash scripts/backup.sh backups
      - name: Cifrar copia y subir ANTES del simulacro (un simulacro fallido nunca deja la noche sin backup)
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          mkdir -p upload
          f=$(ls backups/*.dump | tail -1)
          age -r "$BACKUP_ENCRYPT_RECIPIENT" -o "upload/$(basename "$f").age" "$f"
          cp "$f.json" upload/
      - uses: actions/upload-artifact@v4
        if: steps.cfg.outputs.enabled == 'true'
        with:
          name: backup-${{ github.run_id }}
          path: upload/
          retention-days: 30
      - name: Simulacro de restore en Postgres efímero (falla = alerta)
        if: steps.cfg.outputs.enabled == 'true'
        run: bash scripts/restore-drill.sh "$(ls backups/*.dump | tail -1)" postgres://postgres:postgres@localhost:5432/postgres
      - name: Borrar copia sin cifrar del runner
        if: always()
        run: rm -rf backups
