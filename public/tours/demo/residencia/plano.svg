<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" role="img" aria-labelledby="t">
  <title id="t">Plano demostrativo de una residencia ficticia</title>
  <rect width="1000" height="720" fill="#f4f0ea"/>
  <g id="room-entrada">
    <rect x="400" y="550" width="160" height="146" fill="#f8f5f0" stroke="#141312" stroke-width="5"/>
    <text x="414" y="574" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#6b655e">ENTRADA</text>
  </g>
  <g id="room-living">
    <rect x="300" y="300" width="360" height="250" fill="#f8f5f0" stroke="#141312" stroke-width="5"/>
    <text x="314" y="324" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#6b655e">LIVING</text>
  </g>
  <g id="room-cocina">
    <rect x="660" y="300" width="220" height="130" fill="#f8f5f0" stroke="#141312" stroke-width="5"/>
    <text x="674" y="324" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#6b655e">COCINA</text>
  </g>
  <g id="room-comedor">
    <rect x="660" y="430" width="220" height="120" fill="#f8f5f0" stroke="#141312" stroke-width="5"/>
    <text x="674" y="454" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#6b655e">COMEDOR</text>
  </g>
  <g id="room-pasillo">
    <rect x="220" y="128" width="80" height="382" fill="#f8f5f0" stroke="#141312" stroke-width="5"/>
    <text transform="translate(242 494) rotate(-90)" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#6b655e">PASILLO</text>
  </g>
  <g id="room-dormitorio">
    <rect x="24" y="128" width="196" height="232" fill="#f8f5f0" stroke="#141312" stroke-width="5"/>
    <text x="38" y="152" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#6b655e">DORMITORIO</text>
  </g>
  <g id="room-bano">
    <rect x="24" y="360" width="196" height="150" fill="#f8f5f0" stroke="#141312" stroke-width="5"/>
    <text x="38" y="384" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#6b655e">BAÑO</text>
  </g>
  <g id="room-galeria">
    <rect x="300" y="128" width="580" height="172" fill="#ebe5dc" stroke="#141312" stroke-width="2" stroke-dasharray="10 8"/>
    <text x="314" y="152" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#6b655e">GALERÍA</text>
  </g>
  <g id="room-piscina">
    <rect x="380" y="24" width="500" height="104" fill="#dfe7e6" stroke="#141312" stroke-width="2" stroke-dasharray="10 8"/>
    <text x="394" y="48" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#6b655e">PISCINA</text>
  </g>
  <!-- Puertas (aberturas en blanco sobre el muro) -->
  <g stroke="#f8f5f0" stroke-width="7">
    <line x1="455" y1="550" x2="505" y2="550"/><line x1="660" y1="345" x2="660" y2="395"/><line x1="660" y1="465" x2="660" y2="515"/>
    <line x1="300" y1="400" x2="300" y2="450"/><line x1="220" y1="215" x2="220" y2="265"/><line x1="100" y1="360" x2="150" y2="360"/>
    <line x1="440" y1="300" x2="540" y2="300"/>
  </g>
  <text x="976" y="696" text-anchor="end" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="11" letter-spacing="1.5" fill="#6b655e">PLANO DEMOSTRATIVO · SIN ESCALA · PROPIEDAD FICTICIA</text>
  <g transform="translate(60 640)" fill="none" stroke="#6b655e" stroke-width="2"><circle r="22"/><path d="M0 -16 L6 6 L0 2 L-6 6 Z" fill="#ae2c25" stroke="none"/></g>
  <text x="60" y="680" text-anchor="middle" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#6b655e">N</text>
</svg>
