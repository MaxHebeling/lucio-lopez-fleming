<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" role="img" aria-labelledby="t">
  <title id="t">Plano demostrativo de una residencia ficticia</title>
  <rect width="1000" height="720" fill="#f4f0ea"/>
  <g id="room-entrada">
    <rect x="400" y="550" width="160" height="146" fill="#f8f5f0" stroke="#141312" stroke-width="5"/>
    <text x="480" y="597" text-anchor="middle" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#3a3734">ENTRADA</text>
  </g>
  <g id="room-living">
    <rect x="300" y="300" width="360" height="250" fill="#f8f5f0" stroke="#141312" stroke-width="5"/>
    <text x="480" y="399" text-anchor="middle" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#3a3734">LIVING</text>
  </g>
  <g id="room-cocina">
    <rect x="660" y="300" width="220" height="130" fill="#f8f5f0" stroke="#141312" stroke-width="5"/>
    <text x="770" y="351" text-anchor="middle" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#3a3734">COCINA</text>
  </g>
  <g id="room-comedor">
    <rect x="660" y="430" width="220" height="120" fill="#f8f5f0" stroke="#141312" stroke-width="5"/>
    <text x="770" y="476" text-anchor="middle" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#3a3734">COMEDOR</text>
  </g>
  <g id="room-pasillo">
    <rect x="220" y="128" width="80" height="382" fill="#f8f5f0" stroke="#141312" stroke-width="5"/>
    <text x="260" y="293" text-anchor="middle" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#3a3734">PASILLO</text>
  </g>
  <g id="room-dormitorio">
    <rect x="24" y="128" width="196" height="232" fill="#f8f5f0" stroke="#141312" stroke-width="5"/>
    <text x="122" y="218" text-anchor="middle" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#3a3734">DORMITORIO</text>
  </g>
  <g id="room-bano">
    <rect x="24" y="360" width="196" height="150" fill="#f8f5f0" stroke="#141312" stroke-width="5"/>
    <text x="122" y="409" text-anchor="middle" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#3a3734">BAÑO</text>
  </g>
  <g id="room-galeria">
    <rect x="300" y="128" width="580" height="172" fill="#ebe5dc" stroke="#141312" stroke-width="2" stroke-dasharray="10 8"/>
    <text x="590" y="188" text-anchor="middle" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#3a3734">GALERÍA</text>
  </g>
  <g id="room-piscina">
    <rect x="380" y="24" width="500" height="104" fill="#dfe7e6" stroke="#141312" stroke-width="2" stroke-dasharray="10 8"/>
    <text x="630" y="62" text-anchor="middle" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#3a3734">PISCINA</text>
  </g>
  <!-- Puertas (aberturas en blanco sobre el muro) -->
  <g stroke="#f8f5f0" stroke-width="7">
    <line x1="455" y1="550" x2="505" y2="550"/><line x1="660" y1="345" x2="660" y2="395"/><line x1="660" y1="465" x2="660" y2="515"/>
    <line x1="300" y1="400" x2="300" y2="450"/><line x1="220" y1="215" x2="220" y2="265"/><line x1="100" y1="360" x2="150" y2="360"/>
    <line x1="440" y1="300" x2="540" y2="300"/>
  </g>
  <text x="976" y="700" text-anchor="end" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="13" letter-spacing="2" fill="#6b655e">PLANO DEMOSTRATIVO · SIN ESCALA · PROPIEDAD FICTICIA</text>
  <g transform="translate(60 640)" fill="none" stroke="#6b655e" stroke-width="2"><circle r="22"/><path d="M0 -16 L6 6 L0 2 L-6 6 Z" fill="#ae2c25" stroke="none"/></g>
  <text x="60" y="708" text-anchor="middle" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#6b655e">N</text>
</svg>
